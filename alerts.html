<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>規約アラート</title><style>
:root{--nf:#6d4fc2;--nf-bg:#f1edfb;--bg:#fbfaf7;--fg:#1f2328;--muted:#6b7280;--line:#e2dfd6;--card:#fff;--accent:#0b6e6e;--warn:#9a3412;--warn-bg:#fff4e5;--ok:#166534;--none:#9ca3af}
@media (prefers-color-scheme:dark){:root{--nf:#b9a6f5;--nf-bg:#2a2440;--bg:#15181b;--fg:#e6e6e3;--muted:#9aa0a6;--line:#2c3136;--card:#1c2024;--accent:#5cc8c8;--warn:#fdba74;--warn-bg:#3a2a18;--ok:#86efac;--none:#6b7280}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:40px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
a{color:var(--accent)}nav{font-size:.9rem;margin-bottom:20px}nav a{margin-right:14px}
.lead,.meta{color:var(--muted);font-size:.9rem}.notes{font-size:.9rem;color:var(--muted);padding-left:1.2em}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.88rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-weight:600;white-space:nowrap;background:var(--bg)}tr:last-child td{border-bottom:0}
td.product{font-weight:600;min-width:160px}.unverified{color:var(--none)}.notfound{color:var(--nf);background:var(--nf-bg);border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}.legend{font-size:.85rem;color:var(--muted);margin:10px 0 0}.legend span{margin-right:6px}.value{font-weight:600}.detail{display:block;color:var(--muted);font-size:.82rem}
.src{font-size:.78rem}.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.part{color:var(--ok);border-style:dashed}.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}.tag.none{color:var(--none)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
.card h3{font-size:1rem;margin:6px 0}.card p{margin:6px 0}.memo{border-left:3px solid var(--accent);padding-left:10px}
ul.plain{list-style:none;padding:0}ul.plain li{margin:12px 0}footer{margin-top:48px;font-size:.82rem;color:var(--muted)}
</style></head><body><main><nav><a href="index.html">現状マトリクス</a><a href="alerts.html">規約アラート</a><a href="digests/index.html">週次ダイジェスト</a></nav><h1>規約アラート</h1><p class="lead">人が内容を確認して承認した変更だけを載せています。</p><p class="meta">承認済みのアラートは、まだありません。</p><footer>※ AIによる一次スクリーニング。原文を確認のこと</footer></main></body></html>
